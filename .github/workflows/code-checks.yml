name: Verify bot code

on:
  push:
    branches: [main]
    paths:
      - 'agent/lib/cloud-once.ts'
      - 'agent/lib/cloud-schedule.ts'
      - 'agent/lib/industry-filter.ts'
      - 'agent/lib/industry-bot.ts'
      - 'agent/lib/industry-store.ts'
      - 'agent/tools/scan_reports.ts'
      - 'agent/lib/requested-review-batch.ts'
      - 'scripts/send-requested-reviews.ts'
      - 'tests/cloud-schedule.test.ts'
      - 'tests/industry.test.ts'
      - 'tests/industry-focus.test.ts'
      - 'tests/broker-sources.test.ts'
      - 'tests/public-channels.test.ts'
      - 'tests/requested-review-batch.test.ts'
      - '.github/workflows/requested-reviews.yml'
      - '.github/workflows/code-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_SEND_ENABLED: 'false'
      AI_CLASSIFY: 'false'
      AI_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
