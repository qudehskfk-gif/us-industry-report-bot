name: Validate public source recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'qudehskfk-gif/us-industry-report-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare verified source changes
        shell: python
        run: |
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'qudehskfk-gif/us-industry-report-bot'
          raw = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == '92f3daf6e5736134b9a123c583e29362d5d9ff77b73df456b50d1ffa16c18931'
          files = json.loads(raw)
          assert len(files) == 10
          for name, content in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('agent/lib/', 'tests/', 'scripts/'))
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          Path('/tmp/report-source-patch-paths.json').write_text(json.dumps(list(files)))
          print('Prepared', len(files), 'source files for validation.')
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit validated retrieval code to this repository only
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          files = json.loads(Path('/tmp/report-source-patch-paths.json').read_text())
          subprocess.run(['git', 'config', 'user.name', 'report-bot[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'report-bot@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'Verify publisher identity across the PDF and add Shinhan public reports'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - name: Verify full public-channel PDFs without sending
        run: node scripts/check-public-channels.ts
      - name: Verify existing Hana retrieval after transient error handling
        continue-on-error: true
        run: npm run sources:check -- --sources=hana --pdf
      - name: Inspect other public publisher links without sending
        run: |
          cat > recovery-followup.mjs <<'PUBLIC_FOLLOWUP'
          import {load} from 'cheerio';
          const out=x=>console.log(JSON.stringify({event:'recovery_followup',...x}));
          try{const r=await fetch('https://t.me/s/dbsectech',{signal:AbortSignal.timeout(20000)}),$=load(await r.text());const links=$('.tgme_widget_message_text a[href]').map((_,e)=>$(e).attr('href')).get().filter(x=>/abit\.ly\//.test(x));out({source:'db',status:r.status,links});for(const u of links.slice(0,2)){try{const d=await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(18000)});let text=d.headers.get('location')?'':(await d.text()).slice(0,1500);out({source:'db',url:u,status:d.status,location:d.headers.get('location'),body:text});await d.body?.cancel().catch(()=>{});}catch(e){out({source:'db',url:u,error:e.message,cause:e.cause?.code});}}}catch(e){out({source:'db',error:e.message,cause:e.cause?.code});}
          PUBLIC_FOLLOWUP
          node recovery-followup.mjs
