name: Validate public source recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'qudehskfk-gif/us-industry-report-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare verified source changes
        shell: python
        run: |
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY'] == 'qudehskfk-gif/us-industry-report-bot'
          raw = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest() == 'cd6a4aeabb5855ece683997e3a29c9d093dc9a6d396fab3794fc89d12c0323ce'
          files = json.loads(raw)
          assert len(files) == 15
          for name, content in files.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('agent/lib/', 'tests/', 'scripts/')) or name in ('.env.example', 'README.md', 'GITHUB_SETUP_KO.md', 'SETUP_KO.md', 'SOURCE_STATUS_KO.md')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          Path('/tmp/report-source-patch-paths.json').write_text(json.dumps(list(files)))
          print('Prepared', len(files), 'source files for validation.')
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Commit validated retrieval code to this repository only
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          files = json.loads(Path('/tmp/report-source-patch-paths.json').read_text())
          subprocess.run(['git', 'config', 'user.name', 'report-bot[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'report-bot@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *files], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'Enable four verified public report channels and preserve daily delivery rules'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
      - name: Verify activated public-channel PDFs without sending
        env:
          PUBLIC_CHANNEL_SOURCES: kiwoom,meritz,nh,shinhan
        run: node scripts/check-public-channels.ts
