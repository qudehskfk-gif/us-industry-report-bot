name: Verify public channel PDFs

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated public channel source names'
        required: true
        default: 'kiwoom,meritz,nh,shinhan'
        type: string

permissions:
  contents: read

concurrency:
  group: public-channel-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_CHANNEL_SOURCES: ${{ inputs.sources }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --omit=dev
      - name: Check public lists, full PDF bytes, and publisher identity
        run: node scripts/check-public-channels.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-channel-retrieval-check
          path: data/public-channel-check.json
          if-no-files-found: ignore
          retention-days: 14
