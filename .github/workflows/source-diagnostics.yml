          const errorInfo = e => ({name:e?.name || 'Error',message:String(e?.message || e).slice(0,300),code:e?.code || null,causeCode:e?.cause?.code || null,causeMessage:String(e?.cause?.message || '').slice(0,300)});
          async function probe(item) {
           const start = Date.now(); let url = new URL(item.url); const redirects=[];
           try {
            let response;
            for (let i=0;i<5;i++) {
             if (!permitted(url)) return {...item,status:'redirect_not_approved',redirects,finalHost:url.hostname};
             response = await fetch(url,{redirect:'manual',signal:AbortSignal.timeout(20000),headers:{'User-Agent':'IndustryReportWatch/0.7 (personal research diagnostics)'}});
             if (response.status>=300 && response.status<400) {
              const location=response.headers.get('location');
              await response.body?.cancel();
              if(!location) throw new Error('REDIRECT_WITHOUT_LOCATION');
              const next=new URL(location,url); redirects.push({status:response.status,fromHost:url.hostname,toHost:next.hostname,path:next.pathname});url=next;continue;
             }
             break;
            }
            const base={...item,finalUrl:url.href,http:response?.status,contentType:response?.headers.get('content-type'),redirects,elapsedMs:Date.now()-start};
