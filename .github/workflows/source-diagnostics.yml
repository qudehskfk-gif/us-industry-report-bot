            const reader=response.body.getReader(); const chunks=[];let size=0;
            try { while(size<1048576){const part=await reader.read();if(part.done)break;chunks.push(part.value);size+=part.value.length;if(size>=65536 && Buffer.concat(chunks).subarray(0,5).toString()==='%PDF-')break;} }
            finally {await reader.cancel().catch(()=>{});}
