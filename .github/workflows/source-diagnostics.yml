            const scripts=$('script[src],iframe[src]').map((_,e)=>{try{return new URL($(e).attr('src'),url).href;}catch{return null;}}).get().filter(Boolean).slice(-15);
            $('script,style,noscript').remove();
            const links=$('a[href]').map((_,e)=>{const href=$(e).attr('href')||'';if(!/pdf|research|report|리서치|산업|분석|다운로드|t\.me|download|rf[A-Z]|attachment/i.test(href+' '+$(e).text()))return null;try{const u=new URL(href,url);return /^https?:$/.test(u.protocol)?{text:$(e).text().replace(/\s+/g,' ').trim().slice(0,100),url:u.href}:null;}catch{return null;}}).get().filter(Boolean).slice(-30);
            const body=$('body').text().replace(/\s+/g,' ').trim();
            return {...base,status:'page_read',title,bodyExcerpt:body.slice(-1500),links,scripts};
