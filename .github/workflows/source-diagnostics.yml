name: Diagnose additional public report sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --omit=dev
      - name: Trace public report links without Telegram access
        run: |
          cat > public-link-diagnostics.mjs <<'PUBLIC_DIAGNOSTIC'
          import {load} from 'cheerio';
          import {collectSource} from './agent/lib/industry-sources.ts';
          const output=(x)=>console.log(JSON.stringify({event:'public_link_diagnostic',...x}));
          const hosts=new Set(['bit.ly','buly.kr','zrr.kr','han.gl','vo.la','tinyurl.com','naver.me','www.samsungpop.com','english.samsungpop.com','securities.koreainvestment.com','www.truefriend.com','file.truefriend.com','www.sks.co.kr','sks.co.kr','research.sks.co.kr','www.heungkuksec.co.kr','rdata.kbsec.com','rc.kbsec.com']);
          async function trace(label,address){for(let hop=0;hop<6;hop++){let u=new URL(address);if(u.protocol==='http:')u.protocol='https:';if(u.protocol!=='https:'||u.username||u.password||!hosts.has(u.hostname))return output({label,hop,unapprovedTarget:u.href});try{const r=await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(20000)});const type=r.headers.get('content-type')||'';const location=r.headers.get('location');if(location){await r.body?.cancel();output({label,hop,url:u.href,status:r.status,location});address=new URL(location,u).href;continue;}if(/application\/pdf/i.test(type)){await r.body?.cancel();return output({label,hop,url:u.href,status:r.status,type,pdf:true});}const reader=r.body.getReader();let chunks=[],size=0;while(true){const p=await reader.read();if(p.done)break;chunks.push(p.value);size+=p.value.length;if(size>350000)break;}await reader.cancel();const body=Buffer.concat(chunks).toString('utf8'),$=load(body);output({label,hop,url:u.href,status:r.status,type,title:$('title').text(),text:$('body').clone().find('script,style').remove().end().text().replace(/\s+/g,' ').slice(0,450),links:$('a[href],iframe[src],embed[src],object[data],meta[http-equiv]').map((_,e)=>$(e).attr('href')||$(e).attr('src')||$(e).attr('data')||$(e).attr('content')).get().filter(v=>/pdf|stream|file|url=/i.test(v)).slice(0,12),scripts:$('script').map((_,e)=>({src:$(e).attr('src'),text:$(e).text().split('\n').filter(v=>/pdf|fileName|issueDate|location|streamdocs|window\.open/i.test(v)).slice(0,18).join('\n').slice(0,7000)})).get().filter(v=>v.src||v.text).slice(0,12)});return;}catch(e){return output({label,hop,url:u.href,error:e.message,cause:e.cause?.code});}}}
          await Promise.all([
           trace('KIS optical indepth','https://zrr.kr/zIdBA4'),
           trace('Samsung personal agent','https://bit.ly/4eFFgcU'),
           trace('Samsung components','https://bit.ly/4bRyYG3'),
           trace('SK report shortener','https://buly.kr/uX6ZFg'),
           trace('KB report shortener','https://bit.ly/3Og5fhk')
          ]);
          for(const channel of ['lovequant','KB_EPC_MJ']){try{let r=await fetch('https://t.me/s/'+channel,{signal:AbortSignal.timeout(25000)});let html=await r.text(),$=load(html);let posts=$('.tgme_widget_message[data-post]').toArray().map(e=>({id:$(e).attr('data-post'),text:$(e).find('.tgme_widget_message_text').text().slice(0,1200),links:$(e).find('.tgme_widget_message_text a[href]').map((_,a)=>$(a).attr('href')).get()}));output({channel,status:r.status,posts});}catch(e){output({channel,error:e.message,cause:e.cause?.code});}}
          const form=new URLSearchParams({curPage:'1',bbSeq:'',rGubun:'S01',sctrGubun:'S02',web:'0',hts:'',filepath:'',attaFileNm:'',startDate:'2026/04/28',endDate:'2026/10/27',searchSelect:'0',searchNm1:'',searchNm2:''});
          try{let r=await fetch('https://www.daolsecurities.com/research/article/common.jspx?cmd=list&templet-bypass=true',{method:'POST',body:form,signal:AbortSignal.timeout(25000)});let html=await r.text();output({label:'daol public industry list',status:r.status,total:r.headers.get('totCount'),body:html.slice(0,18000)});}catch(e){output({label:'daol public industry list',error:e.message,cause:e.cause?.code});}
          PUBLIC_DIAGNOSTIC
          node public-link-diagnostics.mjs
